services:
  semaforr:
    build:
      context: .
    image: semaforr-ros2:humble
    network_mode: host
    environment:
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"
    volumes:
      - ./baseline-results:/output
    command:
      - ros2
      - launch
      - semaforr
      - example_simulation.launch.py
      - output:=/output/example-simulation.json

