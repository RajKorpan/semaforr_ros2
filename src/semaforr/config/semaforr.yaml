semaforr:
  ros__parameters:
    configuration:
      use_legacy_files: false

    topics:
      pose: pose
      scan: scan_raw
      command: cmd_vel
      navigation_state: navigation_state
      social_observations: social_observations
      crowd_field: crowd_field

    qos:
      sensors:
        depth: 10
        reliability: reliable
        durability: volatile
      command:
        depth: 1
        reliability: reliable
        durability: volatile

    frames:
      global: map
      scan: base_laser_link
      transform_timeout_s: 0.05

    timing:
      control_rate_hz: 30.0
      sensor_timeout_s: 0.5
      sensor_sync_tolerance_s: 0.1

    social:
      maximum_age_s: 0.75
      minimum_confidence: 0.25
      learning:
        enabled: true
        estimator: count_exposure
        resolution_m: 1.0
        origin_x_m: 0.0
        origin_y_m: 0.0
        discount_factor: 0.7
        minimum_update_period_s: 1.0
        encounter_radius_m: 1.0
        minimum_flow_speed_mps: 0.05
        confidence_exposures: 10.0
        cusum_increase: 4.0
        cusum_decrease: -3.0
        cusum_threshold: 10.0
        random_seed: 0

    command:
      linear_velocity_mps: 0.5
      angular_velocity_radps: 0.5
      turn_linear_velocity_mps: 0.01
      distance_tolerance_m: 0.06
      angle_tolerance_rad: 0.11
      timeout_multiplier: 1.5
      minimum_timeout_s: 0.1
      odometry_reset_distance_m: 2.0
      odometry_reset_angle_rad: 2.8

    # The launch file resolves these data files from the installed package.
    map:
      path: ""
      length_m: 200
      height_m: 200
      granularity_m: 0.3

    mission:
      tasks_path: ""
      decision_limit: 20
      plan_limit: 500

    actions:
      move_distances_m: [0.1, 0.2, 0.4, 0.8, 1.6, 3.2]
      rotation_angles_rad: [0.0873, 0.2618, 0.5236, 0.7854, 1.0472, 1.5708]

    safety:
      visibility_epsilon_m: 0.005
      laser_angle_increment_rad: 0.005817
      robot_radius_m: 0.2794
      obstacle_buffer_m: 0.05
      max_laser_range_m: 5.0
      max_forward_buffer_m: 0.1
      max_forward_sweep_rad: 0.5236

    learning:
      highway_distance_threshold_m: 5.0
      highway_time_threshold_s: 60.0
      highway_decision_threshold: 100.0

    features:
      trails: true
      conveyors: true
      regions: true
      doors: true
      hallways: false
      barriers: false
      astar: false
      highways: false
      frontiers: false
      out_of_here: true
      doorway: true
      find_a_way: false
      behind: true
      dont_go_back: false

    planners:
      enabled: [skeleton, density, risk, flow]

    advisors:
      names:
        - Greedy
        - GreedyRotation
        - ElbowRoom
        - ElbowRoomRotation
        - BigStep
        - BigStepRotation
        - Explorer
        - ExplorerRotation
        - GoAroundRotation
        - RegionLeaverLinear
        - RegionLeaverRotation
        - UnlikelyField
        - UnlikelyFieldRotation
        - EnterLinear
        - EnterRotation
        - ConveyLinear
        - ConveyRotation
        - TrailerLinear
        - TrailerRotation
        - LeastAngle
        - LeastAngleRotation
        - Interpersonal
        - InterpersonalRotation
        - CrowdAvoid
        - CrowdAvoidRotation
        - RiskAvoid
        - RiskAvoidRotation
        - FlowAvoid
        - FlowAvoidRotation
      enabled:
        - true
        - true
        - true
        - true
        - true
        - true
        - true
        - true
        - true
